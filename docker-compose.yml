services:
  backend:
    build: ./cyberguard-backend
    ports:
      - "8000:8000"
    environment:
      CYBERGUARD_ENV: production
      CYBERGUARD_JWT_SECRET: ${CYBERGUARD_JWT_SECRET:?Set CYBERGUARD_JWT_SECRET before starting Docker Compose}
      CYBERGUARD_FRONTEND_ORIGINS: http://localhost:5173
      CYBERGUARD_DB_PATH: /data/cyberguard.db
      CYBERGUARD_DATABASE_URL: ${CYBERGUARD_DATABASE_URL:-}
      CYBERGUARD_SIEM_URL: ${CYBERGUARD_SIEM_URL:-}
      CYBERGUARD_JIRA_URL: ${CYBERGUARD_JIRA_URL:-}
      CYBERGUARD_JIRA_TOKEN: ${CYBERGUARD_JIRA_TOKEN:-}
      CYBERGUARD_JIRA_PROJECT: ${CYBERGUARD_JIRA_PROJECT:-}
      CYBERGUARD_SERVICENOW_URL: ${CYBERGUARD_SERVICENOW_URL:-}
      CYBERGUARD_SERVICENOW_TOKEN: ${CYBERGUARD_SERVICENOW_TOKEN:-}
      CYBERGUARD_GRAPH_TOKEN: ${CYBERGUARD_GRAPH_TOKEN:-}
      CYBERGUARD_OKTA_URL: ${CYBERGUARD_OKTA_URL:-}
      CYBERGUARD_OKTA_TOKEN: ${CYBERGUARD_OKTA_TOKEN:-}
      CYBERGUARD_EDR_URL: ${CYBERGUARD_EDR_URL:-}
      CYBERGUARD_EDR_TOKEN: ${CYBERGUARD_EDR_TOKEN:-}
      CYBERGUARD_SECRET_MANAGER: ${CYBERGUARD_SECRET_MANAGER:-}
      CYBERGUARD_OTEL_ENDPOINT: ${CYBERGUARD_OTEL_ENDPOINT:-}
    volumes:
      - cyberguard-data:/data

  frontend:
    build: ./cyberguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cyberguard-data:

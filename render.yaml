services:
  - type: web
    name: cyberguard-backend
    runtime: python
    rootDir: cyberguard-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: CYBERGUARD_JWT_SECRET
        generateValue: true
      - key: CYBERGUARD_ENV
        value: production
      - key: CYBERGUARD_HEAD_ADMIN_USERNAME
        sync: false
      - key: CYBERGUARD_HEAD_ADMIN_PASSWORD
        sync: false
      - key: CYBERGUARD_FRONTEND_ORIGINS
        sync: false
      - key: CYBERGUARD_PUBLIC_APP_URL
        sync: false
      - key: CYBERGUARD_DB_PATH
        value: /var/data/cyberguard.db
      - key: CYBERGUARD_ALLOW_ANONYMOUS_EVAL
        value: "false"
      - key: CYBERGUARD_DATABASE_URL
        sync: false
      - key: CYBERGUARD_SIEM_URL
        sync: false
      - key: CYBERGUARD_JIRA_URL
        sync: false
      - key: CYBERGUARD_JIRA_TOKEN
        sync: false
      - key: CYBERGUARD_JIRA_PROJECT
        sync: false
      - key: CYBERGUARD_SERVICENOW_URL
        sync: false
      - key: CYBERGUARD_SERVICENOW_TOKEN
        sync: false
      - key: CYBERGUARD_GRAPH_TOKEN
        sync: false
      - key: CYBERGUARD_OKTA_URL
        sync: false
      - key: CYBERGUARD_OKTA_TOKEN
        sync: false
      - key: CYBERGUARD_EDR_URL
        sync: false
      - key: CYBERGUARD_EDR_TOKEN
        sync: false
      - key: CYBERGUARD_SECRET_MANAGER
        sync: false
      - key: CYBERGUARD_OTEL_ENDPOINT
        sync: false
    disk:
      name: cyberguard-data
      mountPath: /var/data
      sizeGB: 1
  - type: web
    name: cyberguard-frontend
    runtime: static
    rootDir: cyberguard-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
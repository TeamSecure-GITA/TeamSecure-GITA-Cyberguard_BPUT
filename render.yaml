services:
  - type: web
    name: cyberguard-backend
    runtime: python
    plan: free
    rootDir: cyberguard-backend
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CYBERGUARD_JWT_SECRET
        generateValue: true
      - key: CYBERGUARD_ENV
        value: production
      - key: CYBERGUARD_ENABLE_PRETRAINED_MEDIA
        value: "false"
      - key: CYBERGUARD_ENABLE_RDAP
        value: "true"
      - key: CYBERGUARD_ENABLE_CT
        value: "true"
      - key: CYBERGUARD_HEAD_ADMIN_USERNAME
        sync: false
      - key: CYBERGUARD_HEAD_ADMIN_PASSWORD
        sync: false
      - key: CYBERGUARD_FRONTEND_ORIGINS
        value: https://teamsecure-gita-cyberguardbputproject-git-main-team-secure1.vercel.app
      - key: CYBERGUARD_PUBLIC_APP_URL
        value: https://teamsecure-gita-cyberguardbputproject-git-main-team-secure1.vercel.app
      - key: CYBERGUARD_DB_PATH
        value: /tmp/cyberguard.db
      - key: CYBERGUARD_ALLOW_ANONYMOUS_EVAL
        value: "false"
      - key: CYBERGUARD_REDIS_URL
        fromService:
          type: keyvalue
          name: cyberguard-ephemeral-store
          property: connectionString
  - type: keyvalue
    name: cyberguard-ephemeral-store
    plan: free
    ipAllowList: []
